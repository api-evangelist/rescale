aid: rescale
name: Rescale
description: >-
  Rescale is a high-performance computing (HPC) and simulation platform that
  gives R&D and engineering teams a unified, cloud-based environment to run
  modeling, simulation, and AI-physics workloads across CPU and GPU
  infrastructure. Engineers submit and orchestrate jobs against hundreds of
  packaged engineering applications (Ansys, STAR-CCM+, Abaqus, COMSOL, OpenFOAM
  and more), manage data and results, and increasingly automate workflows with
  agentic tooling. Rescale exposes a token-authenticated REST API (v2), a
  high-throughput computing (HTC) API with Python and Go clients, a first-party
  CLI, and a hosted Model Context Protocol (MCP) server so agents and automation
  can create, submit, monitor, and manage simulation jobs, files, workstations,
  and clusters programmatically. The platform is FedRAMP-authorized, SOC 2 Type
  II, ISO 27001, ITAR-registered, and FIPS-aligned for aerospace, automotive,
  energy, life-sciences and defense engineering teams.
