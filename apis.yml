    url: authentication/rescale-authentication.yml
- name: Rescale HTC API
  description: >-
    Rescale's high-throughput computing (HTC) REST API for batch container
    workloads, organized around projects, tasks, job batches and a container
    registry, with bearer/JWT token authentication managed via the rescalehtc
    Python client and the htc-cli Go command-line tool.
  humanURL: https://rescale.com/platform/hpc-as-a-service/high-throughput-computing/
  baseURL: https://htc.rescale.com/
  properties:
