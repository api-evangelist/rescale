apis:
- name: Rescale REST API
  description: >-
    Rescale's token-authenticated REST API (v2) for creating, submitting,
    monitoring and managing simulation jobs, uploading and downloading files,
    listing available software (analyses) and hardware (coretypes), and
    organizing work into projects, runs and tags on the Rescale platform.
  humanURL: https://rescale.com/documentation/main/rescale-advanced-features/rest-api/
  baseURL: https://platform.rescale.com/api/v2/
