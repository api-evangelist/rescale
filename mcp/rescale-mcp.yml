    docs: https://platform.rescale.com/user/settings/
  endpoints:
  - region: United States
    url: https://mcp.services.platform.rescale.com/mcp
  - region: Europe
    url: https://mcp.services.eu.rescale.com/mcp
  - region: Korea
    url: https://mcp.services.kr.rescale.com/mcp
  - region: Japan
    url: https://mcp.services.platform.rescale.jp/mcp
capabilities:
- Create, submit, monitor, stop and terminate jobs and workstations
- Upload input files and download result files
- View logs and monitor job/cluster status
